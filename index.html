<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hall of frames</title>
	<link rel="stylesheet" href="style.css">
	<script>
		(() => {
			const saved = localStorage.getItem('theme');
			if (saved) document.documentElement.dataset.theme = saved;
		})();
	</script>
</head>
<body>
	<header>
		<button class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark mode</button>
	</header>
	<main>
		<h1>Hall of frames!</h1>
		<article>
			<section>
				<h2>My first 3D cake!</h2>
				<p>Rendered with pure CSS!</p>
				<iframe src="https://iemand005.github.io/Reconstructed-Adrian/" frameborder="0"></iframe>
			</section>
			<section>
				<h2>My 3rd 3D cake!</h2>
				<p>Rendered with WebGL!</p>
				<iframe src="https://iemand005.github.io/FenixWeb/Cake" frameborder="0"></iframe>
			</section>
		</article>
	</main>
	<footer>Hall of frames</footer>
	<script>
		const btn = document.querySelector('.theme-toggle');
		const root = document.documentElement;

		const current = () =>
			root.dataset.theme ||
			(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

		const sync = () => {
			btn.textContent = current() === 'dark' ? 'Light mode' : 'Dark mode';
		};

		btn.addEventListener('click', () => {
			root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
			localStorage.setItem('theme', root.dataset.theme);
			sync();
		});

		matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync);
		sync();
	</script>
</body>
</html>
